# Publishes the committed WebGL build (Build/WebGL) to GitHub Pages, so the
# game is playable at https://whenommmm.github.io/retro-jackpot/.
name: Deploy WebGL build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Build/WebGL/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Build/WebGL
      - id: deployment
        uses: actions/deploy-pages@v4
