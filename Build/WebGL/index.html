<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Jackpot — a pixel slot machine</title>
    <meta name="description" content="A three-reel retro slot machine built in Unity: pull the lever, line up three of a kind, chase the progressive jackpot.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0B081C; overflow: hidden;
      }
      /* Keep the game at 16:9, as large as the window allows, letterboxed. */
      #unity-canvas {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        display: block; background: #0B081C;
        image-rendering: pixelated;
      }
      #loader {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px;
        background: #0B081C; color: #FFD652;
        font-family: "Press Start 2P", monospace;
        transition: opacity 0.4s steps(4); z-index: 10;
      }
      #title { font-size: 32px; letter-spacing: 4px; text-shadow: 4px 4px 0 #8A2B1E; }
      /* Progress shown as a row of marquee bulbs lighting up. */
      #bulbs { display: flex; gap: 10px; }
      .bulb {
        width: 16px; height: 16px; background: #3A2622;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35);
      }
      .bulb.on { background: #FFD652; box-shadow: 0 0 10px #FFB34A, inset -3px -3px 0 rgba(0,0,0,0.25); }
      #note { font-size: 11px; color: #C7CCFF; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="title">RETRO JACKPOT</div>
      <div id="bulbs"></div>
      <div id="note">WARMING UP THE REELS...</div>
    </div>
    <script>
      var bulbRow = document.getElementById("bulbs");
      for (var i = 0; i < 12; i++) {
        var b = document.createElement("div");
        b.className = "bulb";
        bulbRow.appendChild(b);
      }
    </script>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Vansh Srivastava",
        productName: "Retro Jackpot",
        productVersion: "1.0",
      }, function (progress) {
        var lit = Math.round(progress * 12);
        var bulbs = document.querySelectorAll(".bulb");
        for (var i = 0; i < bulbs.length; i++) bulbs[i].classList.toggle("on", i < lit);
      }).then(function () {
        var loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 450);
        canvas.focus(); // keyboard controls work straight away
      }).catch(function (message) {
        document.getElementById("note").textContent = message;
      });
    </script>
  </body>
</html>
